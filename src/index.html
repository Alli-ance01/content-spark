<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Idea Collector</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Auth Section -->
        <section id="auth-section" class="hidden">
            <div class="container">
                <div class="auth-card">
                    <h1 id="auth-title">Login</h1>
                    <form id="auth-form">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" required placeholder="••••••••">
                        </div>
                        <button type="submit" id="auth-submit-btn" class="btn btn-primary">Login</button>
                    </form>
                    <p class="auth-toggle">
                        <span id="toggle-text">Don't have an account?</span>
                        <a href="#" id="toggle-auth">Sign Up</a>
                    </p>
                </div>
            </div>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="hidden">
            <header class="header">
                <div class="container header-content">
                    <h1>Idea Collector</h1>
                    <div class="user-controls">
                        <span id="user-email"></span>
                        <button id="logout-btn" class="btn btn-outline">Logout</button>
                    </div>
                </div>
            </header>

            <main class="container">
                <div class="actions-bar">
                    <h2>My Ideas</h2>
                    <button id="add-idea-btn" class="btn btn-primary">+ New Idea</button>
                </div>

                <div id="ideas-list" class="ideas-grid">
                    <!-- Ideas will be injected here -->
                    <div class="loading">Loading your ideas...</div>
                </div>
            </main>
        </section>

        <!-- Modal for Add/Edit Idea -->
        <div id="idea-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">Add New Idea</h2>
                    <span class="close-modal">&times;</span>
                </div>
                <form id="idea-form">
                    <input type="hidden" id="idea-id">
                    <div class="form-group">
                        <label for="idea-title">Title</label>
                        <input type="text" id="idea-title" required placeholder="e.g., 5 Tips for Productivity">
                    </div>
                    <div class="form-group">
                        <label for="idea-type">Type</label>
                        <select id="idea-type" required>
                            <option value="idea">Idea</option>
                            <option value="draft">Draft</option>
                            <option value="link">Link</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="idea-content">Content / Description</label>
                        <textarea id="idea-content" rows="4" placeholder="Describe your idea or paste your draft..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="idea-url">URL (Optional)</label>
                        <input type="url" id="idea-url" placeholder="https://...">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline close-modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Idea</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>
</body>
</html>
